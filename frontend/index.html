<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#07131f" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
        <meta name="description" content="Finova — the private finance hub for the Matthews Household." />
        <link rel="icon" href="/finova.svg" type="image/svg+xml" />
        <title>Finova · Matthews Household</title>
        <script>
            (() => {
                const saved = localStorage.getItem('finova-theme') || 'system';
                const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
