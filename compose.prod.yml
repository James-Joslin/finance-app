name: finance-app-prod

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finances_db}
      POSTGRES_USER: ${POSTGRES_USER:-finances_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNT_NAME:-finovabackups}:${AZURITE_ACCOUNT_KEY:?AZURITE_ACCOUNT_KEY must be set}
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /data
      - --disableTelemetry
    volumes:
      - azurite_prod_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const n=require('net');const s=n.connect(10000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backup:
    build:
      context: ./operations
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-finances_db}
      POSTGRES_USER: ${POSTGRES_USER:-finances_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AZURITE_ACCOUNT_NAME: ${AZURITE_ACCOUNT_NAME:-finovabackups}
      AZURITE_ACCOUNT_KEY: ${AZURITE_ACCOUNT_KEY:?AZURITE_ACCOUNT_KEY must be set}
      BACKUP_BLOB_ENDPOINT: http://azurite:10000/${AZURITE_ACCOUNT_NAME:-finovabackups}
      BACKUP_BLOB_CONTAINER: ${BACKUP_BLOB_CONTAINER:-database-backups}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    restart: unless-stopped

  migrations:
    build:
      context: ./migrations
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-finances_db}
      POSTGRES_USER: ${POSTGRES_USER:-finances_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-Disable}
    depends_on:
      db:
        condition: service_healthy
    command: ["upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-finances_db}
      POSTGRES_USER: ${POSTGRES_USER:-finances_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-Disable}
    expose:
      - "8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_prod_data:
  azurite_prod_data:
