name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: finova_ci
      POSTGRES_USER: finova_ci
      POSTGRES_PASSWORD: finova_ci_password
      POSTGRES_SSL_MODE: Disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finova_ci
          POSTGRES_USER: finova_ci
          POSTGRES_PASSWORD: finova_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finova_ci -d finova_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore api.Tests/financesApi.Tests.csproj
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: migrations/requirements.txt
      - name: Install migration dependencies
        run: python -m pip install --requirement migrations/requirements.txt
      - name: Apply database migrations
        working-directory: migrations
        run: alembic upgrade head
      - name: Verify .NET formatting
        run: |
          dotnet format api/financesApi.csproj --no-restore --verify-no-changes
          dotnet format api.Tests/financesApi.Tests.csproj --no-restore --verify-no-changes
      - name: Run Roslyn/.NET analyzers
        run: dotnet build api.Tests/financesApi.Tests.csproj --configuration Release --no-restore --no-incremental --warnaserror -p:RunAnalyzers=true -p:EnableNETAnalyzers=true
      - name: Run tests
        run: dotnet test api.Tests/financesApi.Tests.csproj --configuration Release --no-restore --no-build --verbosity normal

  frontend-quality:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit
      - name: Verify Prettier formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Run tests
        run: npm test -- --reporter=dot
      - name: Build production frontend
        run: npm run build

  browser-e2e:
    name: Playwright household E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run isolated browser workflow
        run: ./scripts/check-integration.sh --e2e-only

  migration-round-trip:
    name: Migration upgrade and downgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: migrations
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: finova_ci
      POSTGRES_USER: finova_ci
      POSTGRES_PASSWORD: finova_ci_password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finova_ci
          POSTGRES_USER: finova_ci
          POSTGRES_PASSWORD: finova_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finova_ci -d finova_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: migrations/requirements.txt
      - name: Install migration dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Re-upgrade to head
        run: alembic upgrade head

  production-images:
    name: Production image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: migrations
            context: ./migrations
            dockerfile: ./migrations/Dockerfile
          - image: backup
            context: ./operations
            dockerfile: ./operations/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  backup-restore:
    name: Backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: finova-backup-ci-${{ github.run_id }}
      FINOVA_ENV_FILE: ${{ github.workspace }}/.env.dev.example
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start disposable database and Blob storage
        run: >-
          docker compose --env-file .env.dev.example --file compose.dev.yml
          up --detach --wait --wait-timeout 60 db azurite
      - name: Build migration image
        run: >-
          docker compose --env-file .env.dev.example --file compose.dev.yml
          build migrations
      - name: Run backup and restore integration test
        run: ./scripts/check-backup-restore.sh
      - name: Clean up disposable recovery stack
        if: always()
        run: >-
          docker compose --env-file .env.dev.example --file compose.dev.yml
          down --volumes --remove-orphans --rmi local

  dockerfile-policy:
    name: Production container pin policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require pinned production container inputs
        run: ./scripts/check-container-pins.sh

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan repository
        run: semgrep scan --config auto --error

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp
          - javascript-typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          category: /language:${{ matrix.language }}

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend-tests
      - frontend-quality
      - browser-e2e
      - migration-round-trip
      - production-images
      - backup-restore
      - dockerfile-policy
      - semgrep
      - codeql
    steps:
      - name: Verify every required CI job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
