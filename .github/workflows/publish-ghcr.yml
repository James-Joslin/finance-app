name: Publish GHCR images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghcr-main-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Publish ${{ matrix.image }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: migrations
            context: ./migrations
            dockerfile: ./migrations/Dockerfile
          - image: backup
            context: ./operations
            dockerfile: ./operations/Dockerfile
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        shell: bash
        env:
          IMAGE_COMPONENT: ${{ matrix.image }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-${IMAGE_COMPONENT}" >> "$GITHUB_OUTPUT"

      - name: Preserve an existing commit-tagged image
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          reference="${{ steps.image.outputs.name }}:sha-${RELEASE_SHA}"
          if inspection="$(docker buildx imagetools inspect "$reference" 2>/dev/null)"; then
            digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<< "$inspection" | head -n 1)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push commit-tagged release image
        id: push
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          sbom: true
          provenance: mode=max

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
          push-to-registry: true

  promote-latest:
    name: Promote latest
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and promote release
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"

          for image in api frontend migrations backup; do
            docker buildx imagetools inspect \
              "ghcr.io/${repository}-${image}:sha-${RELEASE_SHA}" >/dev/null
          done

          for image in api frontend migrations backup; do
            base="ghcr.io/${repository}-${image}"
            docker buildx imagetools create \
              --tag "${base}:latest" \
              "${base}:sha-${RELEASE_SHA}"
          done
